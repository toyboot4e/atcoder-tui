name: Live HTML check
on:
  schedule:
    # Daily at 11:00 UTC = 20:00 JST: before the usual 21:00 JST contest
    # start, so the four probe requests never overlap a running contest.
    - cron: "0 11 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  live-check:
    name: parse live AtCoder pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile
      - name: Parse live pages (4 requests, >=1s apart)
        run: nix develop --command bun run scripts/live-check.ts
